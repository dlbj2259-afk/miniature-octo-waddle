<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WoogzMadeit Client Finder</title>
  <meta name="description" content="AI client-finder agent for WoogzMadeit custom manufacturing" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1b2d'/%3E%3Cpath d='M7 10l4 12 5-9 5 9 4-12' stroke='%23ef7b3e' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="brand brand-lg"><span class="logo">W</span><div><strong>WoogzMadeit</strong><small>Client Finder Agent</small></div></div>
      <label>Email<input name="email" type="email" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn primary block" type="submit">Sign in</button>
      <p class="error" id="login-error"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">W</span><div><strong>WoogzMadeit</strong><small>Client Finder</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="agent-pill" class="agent-pill idle"><span class="dot"></span><span class="txt">Agent idle</span></div>
        <button class="btn ghost sm" id="logout">Sign out</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title">Today</h1>
        <div class="topbar-actions">
          <button class="btn primary" id="find-now">⚡ Find Clients Now</button>
        </div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-panel" id="drawer-panel"></div>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
